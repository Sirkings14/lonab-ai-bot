name: Backfill LONAB Historical Race Database

on:
  schedule:
    # Weekly incremental backfill (adds newly-recapped races)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'ONE-TIME clean rebuild of the whole database from source documents (archives old rows, keeps a safety net). Leave false for a normal backfill.'
        type: boolean
        default: false
      days_back:
        description: 'How many days back to look (60 is plenty for a normal backfill; use 400 for a rebuild)'
        default: '60'
        required: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backfill / rebuild
        shell: bash
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.rebuild }}" = "true" ]; then
            python build_historical_dataset.py ${{ github.event.inputs.days_back || '400' }} --rebuild 2>&1 | tee reports/last_backfill_report.txt
          else
            python build_historical_dataset.py ${{ github.event.inputs.days_back || '60' }} 2>&1 | tee reports/last_backfill_report.txt
          fi

      - name: Commit updated database
        run: |
          git config user.name "LONAB AI Bot"
          git config user.email "bot@lonab-ai.com"
          git add real_history_db.csv backfilled_dates.txt reports/
          if [ -d archive ]; then git add archive/; fi
          git commit -m "Backfill/rebuild: update historical database [skip ci]" || exit 0
          git pull --rebase origin main
          git push
