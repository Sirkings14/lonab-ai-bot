name: Backfill LONAB Historical Race Database

on:
  schedule:
    # Weekly, since each run re-walks the recently-archived programs
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'How many days back to probe for program PDFs'
        default: '60'
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backfill
        run: |
          python build_historical_dataset.py ${{ github.event.inputs.days_back || '60' }}

      - name: Commit updated historical database
        run: |
          git config --global user.name "LONAB AI Bot"
          git config --global user.email "bot@lonab-ai.com"
          git add real_history_db.csv backfilled_dates.txt
          git commit -m "Backfill: add newly-discovered labeled historical races [skip ci]" || exit 0
          git push
