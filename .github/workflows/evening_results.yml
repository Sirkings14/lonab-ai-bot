name: Evening LONAB Results Scoring

on:
  schedule:
    # LONAB posts results anywhere from ~13:00 to ~20:30 Burkina time
    # (UTC+0). Two later runs so a late posting is still caught; the script
    # is idempotent, so the second run does nothing if the first succeeded.
    - cron: '30 21 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Score today's race and learn from it
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --evening

      - name: Save results, scorecard and updated database
        run: |
          git config user.name "LONAB AI Bot"
          git config user.email "bot@lonab-ai.com"
          mkdir -p predictions && touch predictions/.gitkeep
          git add real_history_db.csv backfilled_dates.txt predictions/
          git commit -m "Score race and add result to database [skip ci]" || exit 0
          git pull --rebase origin main
          git push
