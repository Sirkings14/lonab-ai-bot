name: Morning LONAB AI Predictions

on:
  schedule:
    # 08:00 Burkina Faso time (UTC+0 year-round, no offset needed)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Predictions
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # The evening job runs on a different, brand-new machine, so the
      # predictions must be committed here or they are lost.
      - name: Save predictions for tonight's scoring
        run: |
          git config user.name "LONAB AI Bot"
          git config user.email "bot@lonab-ai.com"
          mkdir -p predictions && touch predictions/.gitkeep
          git add predictions/
          git commit -m "Save predictions for scoring [skip ci]" || exit 0
          git pull --rebase origin main
          git push
