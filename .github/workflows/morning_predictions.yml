name: Morning LONAB AI Predictions

on:
  schedule:
    # The next-day programme PDF is often published late, so retry through the day.
    # Safe: main.py skips if that race's predictions already exist.
    - cron: '0 8,11,13,15,17 * * *'
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Predict this race date instead of tomorrow, e.g. 22-11-2026 (leave empty for normal)'
        type: string
        default: ''
      force:
        description: 'Redo predictions even if they already exist for that race'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lonab-repo-writes
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Predictions
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
          TARGET_DATE: ${{ inputs.race_date }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save predictions for tonight's scoring
        run: |
          git config user.name "LONAB AI Bot"
          git config user.email "bot@lonab-ai.com"
          mkdir -p predictions && touch predictions/.gitkeep
          git add predictions/
          git commit -m "Save predictions for scoring [skip ci]" || exit 0
          git pull --rebase origin main
          git push
